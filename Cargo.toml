[workspace]
resolver = "3"
members = [
    "crates/agrafe",
    "crates/agrafe-crypto",
    "crates/agrafe-extract",
    "crates/agrafe-render",
    "crates/agrafe-render-text",
    "crates/agrafe-sandbox",
    "crates/agrafe-types",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.lints.clippy]
all = "warn"
