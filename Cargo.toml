[workspace]
resolver = "3"
members = [
    "crates/agrafe",
    "crates/agrafe-axum",
    "crates/agrafe-crypto",
    "crates/agrafe-dashboard",
    "crates/agrafe-extract",
    "crates/agrafe-render",
    "crates/agrafe-render-document",
    "crates/agrafe-render-geo",
    "crates/agrafe-render-text",
    "crates/agrafe-sandbox",
    "crates/agrafe-server",
    "crates/agrafe-types",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.lints.rust]
# Set by cargo-llvm-cov.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = "warn"
