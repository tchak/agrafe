[workspace]
resolver = "3"
members = [
    "crates/agrafe",
    "crates/agrafe-axum",
    "crates/agrafe-crypto",
    "crates/agrafe-dashboard",
    "crates/agrafe-extract",
    "crates/agrafe-render",
    "crates/agrafe-render-document",
    "crates/agrafe-render-geo",
    "crates/agrafe-render-text",
    "crates/agrafe-sandbox",
    "crates/agrafe-server",
    "crates/agrafe-types",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/tchak/agrafe"
homepage = "https://tchak.github.io/agrafe/"

[workspace.lints.rust]
# Everything public is documented: the crates are published, and docs.rs
# is their reference.
missing_docs = "warn"
# Set by cargo-llvm-cov.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rustdoc]
# The docs are read from the inside: CI builds them with
# `--document-private-items`, where a link to a private item resolves.
private_intra_doc_links = "allow"
