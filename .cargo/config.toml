[alias]
# Line coverage of the whole workspace, unit and integration tests alike.
# Needs cargo-llvm-cov (`cargo install cargo-llvm-cov`) and the test
# database. Extra flags pass through: `--html --open` for a browsable
# report, `--show-missing-lines` for the uncovered lines.
coverage = ["llvm-cov", "--workspace"]

[env]
# The server the tests create each test's database on, and the database
# they connect to for that: `agrafe_test` as the current OS user, over
# the local Unix socket when there is one, else localhost. The
# socket matters with Postgres.app, which identifies the client of each
# trust connection and, over TCP, now and then fails to under the many
# connections parallel tests open. A `DATABASE_URL` in the environment wins.
DATABASE_URL = { value = "postgres:///agrafe_test", force = false }
