name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    # Under a minute warm; a cold cache rebuilds every dependency.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Two to three minutes warm. nextest kills a stuck test after a minute;
    # this bounds the rest, a build or a service that never answers.
    timeout-minutes: 30
    # The renderer passes `vips thumbnail --output-profile`, which needs
    # libvips 8.17 or newer: Ubuntu 24.04 ships 8.15, Debian trixie 8.16.
    container: debian:forky
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrafe_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agrafe_test
    steps:
      - name: Install libvips and a toolchain's prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libvips-tools build-essential ca-certificates curl git
          vips --version
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      # No doctests in the workspace: nextest runs everything there is.
      - name: Test
        run: cargo nextest run --workspace --profile ci

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
