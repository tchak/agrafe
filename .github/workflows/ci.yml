name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the suite on the tagged commit first.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-26.04
    # Under a minute warm; a cold cache rebuilds every dependency.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # A migration in a release is applied in deployed databases, whose
      # processes refuse to start once its checksum changes: against the
      # newest tag, the directory may only gain files. See DESIGN.md,
      # "Migrations".
      - name: Released migrations are unchanged
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          # versionsort.suffix puts v0.2.0-rc.1 before v0.2.0.
          tag=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -n1)
          if [[ -z $tag ]]; then
            echo "no release yet"
            exit 0
          fi
          changed=$(git diff --no-renames --name-status --diff-filter=a \
            "$tag" HEAD -- crates/agrafe/migrations)
          if [[ -n $changed ]]; then
            echo "::error::migrations released in $tag changed; add a new migration instead"
            echo "$changed"
            exit 1
          fi
          echo "the migrations of $tag are unchanged"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The exporters are features: the build without them compiles too.
      - run: cargo clippy -p agrafe-server --all-targets --no-default-features
      # Broken intra-doc links only warn, and only under rustdoc.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # The libraries the crates depend on each other through, those of
  # `[workspace.dependencies]`, against their newest release on crates.io.
  # A requirement of `0.1.0` accepts any `0.1.x`, so a patch release that
  # breaks one breaks every crate built against it. Only where the version
  # is bumped: the release's pull request, from the `release/v<version>`
  # bookmark `cargo xtask release` pushes, and its tag, through the release
  # workflow (a called workflow sees the caller's ref). Between releases the
  # manifest carries the released version, and a break is allowed before
  # 1.0: it makes the next release a minor one, which the changelog says.
  semver:
    name: Semver
    if: startsWith(github.head_ref, 'release/v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    # Both versions' rustdoc of every dependency, cold.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/semver-checks
      - name: Check the libraries against their newest release
        run: |
          packages=$(sed -n '/^\[workspace.dependencies\]/,/^\[/s/^\(agrafe[a-z-]*\) = .*/\1/p' Cargo.toml)
          args=()
          for package in $packages; do args+=(-p "$package"); done
          cargo semver-checks "${args[@]}"

  # Two jobs, side by side. `Test` runs the workspace, the API suite's
  # renders confined by Landlock and seccomp, which is what a deployment
  # without bubblewrap gets, every Docker one included. `Test under
  # bubblewrap` runs the API suite again with every tool through
  # `/usr/bin/bwrap`, where Landlock yields to a mount namespace that checks
  # the system set harder (a path Landlock lets `stat` does not exist
  # there). The main ruleset requires `Test` by name.
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    # Two to three minutes warm. nextest kills a stuck test after a minute;
    # this bounds the rest, a build or a service that never answers.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            packages: --workspace
          - name: Test under bubblewrap
            packages: -p agrafe-axum
            bubblewrap: /usr/bin/bwrap
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agrafe_test
      # The runner's kernel has Landlock and seccomp, and Ubuntu 26.04's
      # AppArmor profile grants /usr/bin/bwrap its user namespace: the
      # sandbox tests, bubblewrap's included, must confine, not skip, so a
      # regression is not a green empty suite.
      AGRAFE_SANDBOX_REQUIRED: 1
      # Line numbers in a panic's backtrace, without the rest of the debug
      # info: a smaller cache to restore and less to link.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # LibreOffice for the office thumbnail tests, which skip without it;
      # bubblewrap for the sandbox's bubblewrap tests, likewise; pandoc for
      # the DOCX and ODT documents, whose tests and probe need it. The runner's
      # mirror serves the 113 MB of packages at under 1 MB/s, so the .debs
      # are cached, keyed on the exact URIs apt resolves: an updated package
      # misses the key, restores the previous set and downloads only itself.
      - name: Resolve the system packages
        id: apt
        env:
          PACKAGES: >-
            libvips-tools libheif-plugin-libde265 bubblewrap libreoffice-writer-nogui libreoffice-calc-nogui
            unzip libarchive-tools pandoc
            libreoffice-impress-nogui libreoffice-draw-nogui fonts-dejavu-core
            fonts-liberation
        run: |
          sudo apt-get update -o Acquire::Retries=3
          mkdir -p ~/apt-archives
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "uris=$(sudo apt-get install -qq --print-uris --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" $PACKAGES | sha256sum | cut -c1-16)" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: apt-cache
        with:
          # Not partial/, which apt creates root-only.
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt.outputs.uris }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: Install libvips, LibreOffice and bubblewrap
        # Warm, seconds; cold, two to three minutes. A mirror that stalls
        # fails here, by name, rather than eating the job's timeout.
        timeout-minutes: 10
        run: |
          # The archive is the runner's, not _apt's: download as root. A
          # stalled connection is dropped after 30 s and retried.
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Sandbox::User=root \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 \
            ${{ steps.apt.outputs.packages }}
          # Drop the versions the mirror no longer serves before the save.
          sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-archives"
          vips --version
          soffice --version
          bwrap --version
          # What the sandbox tests will find: the profile, and the sysctl
          # that makes it matter.
          ls -l /etc/apparmor.d/bwrap-userns-restrict || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      # Saved now, not at the end of the job: a run whose build or tests
      # fail still keeps the download.
      # By `Test` alone: the two jobs would race for the same key.
      - uses: actions/cache/save@v6
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' && !matrix.bubblewrap }}
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: actions/checkout@v7
      # The alert rules and the /metrics lint are checked once, in `Test`.
      - name: Install promtool
        if: ${{ !matrix.bubblewrap }}
        env:
          PROMETHEUS_VERSION: 3.5.0
          PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
        run: |
          name="prometheus-$PROMETHEUS_VERSION.linux-amd64"
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$name.tar.gz"
          echo "$PROMETHEUS_SHA256  /tmp/prometheus.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/prometheus.tar.gz -C /usr/local/bin --strip-components=1 "$name/promtool"
          promtool --version
      # The rules the monitoring guide publishes, before the long build.
      - name: Check the alert rules
        if: ${{ !matrix.bubblewrap }}
        run: |
          promtool check rules config/alerts.yml
          promtool test rules config/alerts.test.yml config/alerts.days.test.yml
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Both jobs build the same thing: one cache, saved by `Test`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ !matrix.bubblewrap }}
      # The whole workspace in both: the API suite runs the helpers' binaries.
      - name: Build
        run: cargo build --workspace --all-targets
      # No doctests in the workspace: nextest runs everything there is.
      - name: Test
        env:
          PACKAGES: ${{ matrix.packages }}
          BUBBLEWRAP: ${{ matrix.bubblewrap }}
        run: |
          # Set or absent, never empty: the suite reads an empty path as one.
          if [[ -n $BUBBLEWRAP ]]; then
            # The real tools through bubblewrap: the probe, vips, the helpers
            # and LibreOffice.
            export AGRAFE_TEST_BUBBLEWRAP=$BUBBLEWRAP
          else
            # The metrics test lints what /metrics exposes; it skips without this.
            export AGRAFE_TEST_PROMTOOL=/usr/local/bin/promtool
          fi
          cargo nextest run $PACKAGES --profile ci

  # The oldest toolchain the workspace builds with, its `rust-version`.
  # The job's name carries no version: the main ruleset requires it by
  # name, and raising the MSRV is a change to Cargo.toml alone.
  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error::Cargo.toml has no rust-version"
            exit 1
          fi
          echo "MSRV $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
