name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-26.04
    # Under a minute warm; a cold cache rebuilds every dependency.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # Broken intra-doc links only warn, and only under rustdoc.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-26.04
    # Two to three minutes warm. nextest kills a stuck test after a minute;
    # this bounds the rest, a build or a service that never answers.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agrafe_test
      # The runner's kernel has Landlock and seccomp: the sandbox tests
      # must confine, not skip, so a regression is not a green empty suite.
      AGRAFE_SANDBOX_REQUIRED: 1
    steps:
      # LibreOffice for the office thumbnail tests, which skip without it.
      - name: Install libvips and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools \
            libreoffice-writer-nogui libreoffice-calc-nogui fonts-dejavu-core fonts-liberation
          vips --version
          soffice --version
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      # No doctests in the workspace: nextest runs everything there is.
      - name: Test
        run: cargo nextest run --workspace --profile ci

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
