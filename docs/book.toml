[book]
title = "agrafe"
description = "Encrypted, virus-scanned file storage with previews, thumbnails and generated files."
authors = ["Paul Chavard"]
language = "en"
src = "src"

[build]
build-dir = "book"

# {{version}}, {{series}}, {{next_minor}} and {{next_patch}} in a chapter
# are the workspace's version, filled in by xtask (xtask/src/book.rs), after
# the includes so that what they bring in is checked too. The book is
# deployed from a release's tag, so it quotes that release's versions.
[preprocessor.version]
command = "cargo xtask mdbook"
after = ["links"]

[output.html]
site-url = "/agrafe/"
git-repository-url = "https://github.com/tchak/agrafe"
edit-url-template = "https://github.com/tchak/agrafe/edit/main/docs/{path}"

[output.html.search]
limit-results = 30
