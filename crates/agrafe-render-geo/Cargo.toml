[package]
name = "agrafe-render-geo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sandboxed helper: draws the geometry of a GeoJSON, GPX, KML, KMZ or GML file or a zipped shapefile as SVG paths over the map extent it chose"
repository.workspace = true
homepage.workspace = true
keywords = ["geojson", "gpx", "kml", "shapefile", "gml"]
categories = ["science::geo", "rendering"]

[lints]
workspace = true

[dependencies]
agrafe-types.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
geojson = { version = "1.0.0", default-features = false }
quick-xml = "0.42.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
