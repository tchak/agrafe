[package]
name = "agrafe-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runs decoders and renderers as subprocesses with resource limits"
repository.workspace = true
homepage.workspace = true
keywords = ["sandbox", "landlock", "seccomp", "rlimit", "subprocess"]
categories = ["os::linux-apis", "os::unix-apis"]

[lints]
workspace = true

[dependencies]
bytesize = { version = "2.7.0", features = ["serde"] }
humantime-serde = "1.1.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["process", "time", "io-util", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
