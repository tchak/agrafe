[package]
name = "agrafe-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The agrafe binary: serve the two interfaces and the workers, run migrations"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["file-storage", "upload", "antivirus", "thumbnail", "server"]
categories = ["web-programming::http-server", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "agrafe"
path = "src/main.rs"
# Its docs would land in `target/doc/agrafe`, over the library's.
doc = false

[features]
# Both exporters are in the default build and off until configured: a
# release image has them, and a build that wants neither says so with
# `--no-default-features`. See DESIGN.md, "Tracing".
default = ["sentry", "otel"]
sentry = ["dep:sentry", "dep:serde", "dep:serde_json"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:http",
]

[dependencies]
agrafe.workspace = true
agrafe-axum.workspace = true
agrafe-dashboard.workspace = true
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
sqlx = { version = "0.9.0", default-features = false, features = ["migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
http = { version = "1.5.0", optional = true }
# `internal-logs`: the SDK's own diagnostics, a failed export or a full
# queue, as `tracing` events on stderr. Without it they compile to nothing.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs", "grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "tls-aws-lc", "tls-roots"], optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.154", optional = true }
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls"], optional = true }
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["tracing-log"], optional = true }

[dev-dependencies]
# `TestDatabase`: a database of its own for each test.
agrafe = { workspace = true, features = ["test-support"] }
# Reading what the exporters send, in the fake collector of tests/exporters.rs.
axum = { version = "0.8.9", features = ["http2"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
tokio = { version = "1.54.0", features = ["time"] }
tempfile = "3.27.0"
