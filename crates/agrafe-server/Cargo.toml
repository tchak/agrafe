[package]
name = "agrafe-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The agrafe binary: serve the two interfaces and the workers, run migrations"

[lints]
workspace = true

[[bin]]
name = "agrafe"
path = "src/main.rs"
# Its docs would land in `target/doc/agrafe`, over the library's.
doc = false

[dependencies]
agrafe = { version = "0.1.0", path = "../agrafe" }
agrafe-axum = { version = "0.1.0", path = "../agrafe-axum" }
agrafe-dashboard = { version = "0.1.0", path = "../agrafe-dashboard" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
sqlx = { version = "0.9.0", default-features = false, features = ["migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
