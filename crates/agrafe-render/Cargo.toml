[package]
name = "agrafe-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Derived representations for agrafe: which files render, vips and the sandboxed helpers that do it"

[lints]
workspace = true

[dependencies]
agrafe-sandbox = { version = "0.1.0", path = "../agrafe-sandbox" }
agrafe-types = { version = "0.1.0", path = "../agrafe-types" }
bytesize = { version = "2.7.0", features = ["serde"] }
futures = "0.3.34"
humantime-serde = "1.1.1"
# Fetches the background layers of a map. Already in the tree, with rustls.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "io-util", "process", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
