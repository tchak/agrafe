[package]
name = "agrafe-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Derived representations for agrafe: which files render, vips and the sandboxed helpers that do it"

[lints]
workspace = true

[dependencies]
agrafe-sandbox = { version = "0.1.0", path = "../agrafe-sandbox" }
agrafe-types = { version = "0.1.0", path = "../agrafe-types" }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util", "process"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
