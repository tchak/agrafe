[package]
name = "agrafe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "File storage service: encrypted, scanned, with previews. The library; see agrafe-axum and agrafe-server"

[lints]
workspace = true

[dependencies]
agrafe-crypto = { version = "0.1.0", path = "../agrafe-crypto" }
agrafe-render = { version = "0.1.0", path = "../agrafe-render" }
agrafe-types = { version = "0.1.0", path = "../agrafe-types" }
base64 = "0.23.1"
bytes = "1"
bytesize = { version = "2.7.0", features = ["serde"] }
crc32fast = "1.5.2"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
humantime-serde = "1.1.1"
jiff = { version = "0.2.38", features = ["serde"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
memchr = "2.8.3"
mime = "0.3.17"
object_store = { version = "0.14.2", features = ["aws"] }
percent-encoding = "2.3.2"
prometheus = { version = "0.14.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "json"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
# Reads the archives and packages the builds write back, in tests only.
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
