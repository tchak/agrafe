[package]
name = "agrafe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "File storage service: encrypted, scanned, with previews. The library; see agrafe-axum and agrafe-server"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["file-storage", "upload", "encryption", "antivirus", "thumbnail"]
categories = ["web-programming", "multimedia::images"]

[lints]
workspace = true

[features]
# `db::test::TestDatabase`, a database of its own for each test of the
# crates downstream. For their dev-dependencies only.
test-support = []

[dependencies]
agrafe-crypto = { version = "0.1.0", path = "../agrafe-crypto" }
agrafe-render = { version = "0.1.0", path = "../agrafe-render" }
agrafe-types = { version = "0.1.0", path = "../agrafe-types" }
# The object store's trait, implemented by the wrapper that traces it.
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1"
bytesize = { version = "2.7.0", features = ["serde"] }
crc32fast = "1.5.2"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
futures = "0.3.34"
# The ids of traces started here. Already in the tree.
getrandom = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
humantime-serde = "1.1.1"
jiff = { version = "0.2.38", features = ["serde"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
md-5 = "0.11.0"
memchr = "2.8.3"
mime = "0.3.17"
moka = { version = "0.12.16", features = ["sync"] }
object_store = { version = "0.14.2", features = ["aws", "azure", "gcp"] }
percent-encoding = "2.3.2"
prometheus = { version = "0.14.0", default-features = false }
# The fetch client. Already in the tree through object_store, with rustls like sqlx.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
# To tell a TLS failure, permanent, from the network, retried, in a fetch error's chain.
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "json"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
tokio-stream = "0.1.19"
# The KEK file: parsed by hand so that a syntax error can be reported without
# the offending line, which holds a key. figment's errors quote the source.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
# Not called: sqlx-postgres 0.9 depends on it without its `std` backend, so a
# database URL without a user connects as "anonymous" instead of the OS user.
whoami = { version = "2.1.3", default-features = false, features = ["std"] }
# Wipes the secrets of config, and the text of the KEK file, when dropped.
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
# Reads the archives and packages the builds write back, in tests only.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
