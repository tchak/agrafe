[package]
name = "agrafe-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The HTML dashboard of agrafe as an axum router: the queue, the blobs and the attachments, for operators"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["axum", "dashboard", "file-storage", "admin", "job-queue"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[dependencies]
agrafe = { version = "0.1.0", path = "../agrafe" }
agrafe-axum = { version = "0.1.0", path = "../agrafe-axum" }
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8.9", features = ["form", "query", "original-uri"] }
futures = "0.3.34"
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_plain = "1.0.2"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", default-features = false }
thiserror = "2.0.21"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
# `TestDatabase`: a database of its own for each test, migrated afresh.
agrafe = { version = "0.1.0", path = "../agrafe", features = ["test-support"] }
base64 = "0.23.1"
figment = { version = "0.10.19", features = ["toml"] }
http-body-util = "0.1.5"
# The tests' own queries.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.0", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
