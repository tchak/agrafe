[package]
name = "agrafe-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The HTML dashboard of agrafe as an axum router: the queue, the blobs and the attachments, for operators"

[lints]
workspace = true

[dependencies]
agrafe = { version = "0.1.0", path = "../agrafe" }
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8.9", features = ["form", "query", "original-uri"] }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", default-features = false }
thiserror = "2.0.21"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
base64 = "0.23.1"
figment = { version = "0.10.19", features = ["toml"] }
http-body-util = "0.1.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
