[package]
name = "agrafe-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The HTTP interfaces of agrafe as axum routers, to serve or to nest in another application"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["axum", "file-storage", "upload", "signed-url", "router"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[dependencies]
agrafe.workspace = true
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.23.1"
bytes = "1"
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
jiff = { version = "0.2.38", features = ["serde"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
# `TestDatabase`: a database of its own for each test, migrated afresh.
agrafe = { workspace = true, features = ["test-support"] }
agrafe-crypto.workspace = true
agrafe-render.workspace = true
async-trait = "0.1.92"
bytesize = "2.7.0"
figment = { version = "0.10.19", features = ["toml", "test"] }
hmac = "0.13.0"
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
md-5 = "0.11.0"
object_store = "0.14.2"
sha2 = "0.11.1"
# The tests' own queries.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
