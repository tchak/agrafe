[package]
name = "agrafe-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sandboxed helper: pulls the embedded image out of a PDF, DOCX or ODT that is really a wrapped picture"
repository.workspace = true
homepage.workspace = true
keywords = ["pdf", "docx", "odt", "image", "extract"]
categories = ["multimedia::images", "parser-implementations"]

[lints]
workspace = true

[dependencies]
agrafe-types.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
lopdf = { version = "0.45.0", default-features = false }
quick-xml = "0.42.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
