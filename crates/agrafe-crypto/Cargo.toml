[package]
name = "agrafe-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Streaming AEAD (Tink AES-GCM-HKDF-STREAMING) and key wrapping for agrafe"

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
hkdf = "0.13.0"
rand = "0.10.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
