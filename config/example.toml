# agrafe — configuration reference.
#
# Every key can be overridden by an environment variable prefixed with AGRAFE_
# and nested with a double underscore: AGRAFE_DATABASE__URL, AGRAFE_SIGNING__CURRENT_KEY.
# Secrets should come from the environment in production.

[server]
# Private interface: no signatures, trusted network only. A worker-only
# process binds it too, serving /healthz and /metrics alone.
private_addr = "127.0.0.1:8080"
# Public interface: every URL is signed.
public_addr = "127.0.0.1:8081"
# Base used when minting public URLs. No trailing slash.
public_base_url = "http://127.0.0.1:8081"
# Which parts of the service this process runs: "api", "worker" or "all".
# The --role flag on the command line takes precedence.
role = "all"
# The names and ports the private interface is reached under. Set, a
# private request whose Host is none of them is refused (403), except on
# /healthz and /metrics, which probes reach by address. This is what stops
# DNS rebinding: a web page an operator visits cannot otherwise re-point its
# own name at this address and read the private API from their browser. Set
# it whenever a browser uses the port, which the dashboard implies.
# private_hosts = ["agrafe.internal:8080", "127.0.0.1:8080"]

[database]
url = "postgres://localhost/agrafe_dev"
max_connections = 10

[storage]
# "local", "s3", "azure" or "gcs".
backend = "local"

[storage.local]
path = "./data"

# The bucket needs an AbortIncompleteMultipartUpload lifecycle rule (one day
# is fine): a crashed process cannot abort the multipart uploads it had open.
# [storage.s3]
# bucket = "agrafe"
# region = "fr-par"
# endpoint = "https://s3.fr-par.scw.cloud"
# access_key_id = ""        # prefer AGRAFE_STORAGE__S3__ACCESS_KEY_ID
# secret_access_key = ""    # prefer AGRAFE_STORAGE__S3__SECRET_ACCESS_KEY

# Uncommitted blocks are discarded by Azure after seven days; no rule needed.
# Without access_key, the AZURE_* environment variables or a managed identity.
# [storage.azure]
# account = "agrafe"
# container = "agrafe"
# access_key = ""           # prefer AGRAFE_STORAGE__AZURE__ACCESS_KEY
# endpoint = ""             # Azurite or a sovereign cloud

# The bucket needs an AbortIncompleteMultipartUpload lifecycle rule, as on S3.
# Without service_account_key, GOOGLE_SERVICE_ACCOUNT, the application default
# credentials or the metadata server.
# [storage.gcs]
# bucket = "agrafe"
# service_account_key = ""  # the JSON key itself; prefer AGRAFE_STORAGE__GCS__SERVICE_ACCOUNT_KEY

[signing]
# Key used to mint new tokens. All keys in [signing.keys] remain valid for
# verification, which is what makes rotation possible.
current_key = "k1"
# Mint expiries are rounded up to the next window boundary before the TTL is
# added, so URLs minted inside one window are identical and cacheable.
window = "1h"

[signing.keys]
# Key ids appear in URL tokens: letters, digits, `-` and `_` only.
# Values are 32 random bytes, base64. Generate with: openssl rand -base64 32
k1 = "REPLACE_ME_WITH_32_RANDOM_BYTES_IN_BASE64_____"

[signing.ttl]
upload = "1h"
metadata = "24h"
read = "24h"
# The longest any URL may live. Caps the three above, the `ttl` a backend
# may ask for when minting, and the expiry of any token the public port
# accepts, so a holder of the signing key cannot mint around it. There are
# no permanent URLs: a stable link is a backend route that re-mints.
max = "7d"

[upload]
# Hard cap on any upload.
max_size = "5 GiB"
# Files up to this size are scanned inline during upload; larger files are
# stored first and scanned by a job, which streams them to clamd too. See
# the [clamav] section for the clamd limits that must follow max_size.
inline_scan_max_size = "25 MiB"
# An upload in flight touches its blob every third of this; one not touched
# for this long was left behind by a crashed process and the reaper resets
# it. Slow uploads are never reset, however long they take.
stale_after = "10m"
# Grace period before the object a delete released is purged from the bucket.
# Downloads that started before the delete keep their bytes.
purge_delay = "1h"
# A rows or archive source left unfinished for this long after its last part
# is an abandoned export, and an attached blob still waiting for its bytes
# after this long untouched is a file that never came: the reaper expires
# both, purging any parts and keeping the attachments for the record's side
# to see. Unattached blobs have their own expires_at instead.
abandoned_after = "1d"

[blobs]
# A blob created without expires_at or expires_in expires after this, long
# enough for a direct upload to be created, sent by the browser and attached
# when the form is submitted. The first attachment clears the expiry; the
# last detach sets it again, counted from that moment. At least an hour: a
# form takes as long as its user takes.
default_expires_in = "1d"
# A terminal blob's row stays this long after its objects were purged (or
# after it went terminal with nothing to purge), answering GET /blobs/:id
# with its state, before the reaper removes it with its attachments.
keep_purged = "90d"
# The read routes keep a row they served for this long, when nothing is
# under way on it (the blob is ready or terminal, no render is pending), so
# a blob read many times costs one query per process per period. A delete
# or an expiry recorded meanwhile is seen late by at most this much on other
# processes; the objects are gone only once the purge ran anyway. "0s" keeps
# nothing.
read_cache_ttl = "30s"
# Rows kept at most, per process. A row is a few hundred bytes.
read_cache_entries = 100000

[archive]
# Upper bound on a generated archive, checked against the members' sizes as
# the manifest is accepted. At most 309 GiB: the build writes 32 MiB parts,
# the object store allows 10 000 per object, and the encryption needs a
# margin on top of the estimate.
max_size = "100 GiB"

[document]
# Upper bound on the workspace of a generated document, the members' sizes
# plus the inline files, checked as the manifest is accepted and again by
# the build, which writes the workspace to the worker's disk for the
# compiler.
max_workspace_size = "256 MiB"
# Upper bound on the files of a workspace, the manifest's lines across its
# parts: bytes alone do not bound what an empty file costs the worker's
# disk.
max_files = 10000

[fetch]
# How `url` blobs are fetched: the service downloads the file from the URL
# given at creation, through a job, instead of receiving it through a PUT.
# The TCP connect and the TLS handshake.
connect_timeout = "10s"
# The longest a read may wait for the next bytes of the response. A remote
# that stalls fails the attempt here, so it cannot hold a fetch worker.
read_timeout = "30s"
# The whole response, headers and body: a backstop behind read_timeout, so
# a large file on a slow link is not cut off while it is still flowing. A
# fetch past it fails the attempt and starts over at the next.
timeout = "6h"
# Redirects followed at most, each hop under the same checks as the first.
max_redirects = 5
# A 429 or 503 may say when to come back; a Retry-After beyond this is not
# waited for and the fetch is dead at once.
max_retry_after = "15m"
# URLs must be https, without credentials, and must not lead to loopback,
# private, link-local or cloud metadata addresses, as literals or through
# DNS. Setting this lifts those two rules, for local development and the
# tests. Never in production.
allow_private_networks = false
# Sent with every fetch.
# user_agent = "agrafe/0.1.0"

[encryption]
current_kek = "kek1"
# Streaming AEAD segment size, at most 16 MiB: a segment is held in memory
# whole per in-flight request. Stored per blob, so it can change later.
chunk_size = "256 KiB"

# More KEKs from a file in the shape of [encryption.keks] below, `id = "…"`
# lines, read once at startup and never again. May be a FIFO fed by
# systemd-ask-password or a systemd credential, so the KEKs stay off the
# host's disk; see the security guide. An id in both places is an error.
# keks_file = "/run/credentials/agrafe.service/keks"

[encryption.keks]
# 32 random bytes, base64. Generate with: openssl rand -base64 32
kek1 = "REPLACE_ME_WITH_32_RANDOM_BYTES_IN_BASE64_____"

[clamav]
# clamd's TCP socket. When it cannot be reached, uploads still succeed and
# their scan is deferred to a job, retried until clamd answers.
#
# clamd's own limits default to mail-sized files. In clamd.conf, set
# StreamMaxLength, MaxScanSize and MaxFileSize above upload.max_size: past
# StreamMaxLength clamd hangs up and the scan fails, but past MaxScanSize or
# MaxFileSize it scans a prefix and still answers OK. Set AlertExceedsMax to
# yes so that a limit hit anyway is reported as FOUND rather than as clean.
addr = "127.0.0.1:3310"
# Bounds each write and the wait for the verdict, not a whole scan.
timeout = "60s"
# The TCP connect alone. An upload waits this long at most before giving up
# on an inline scan and deferring it, so keep it short.
connect_timeout = "5s"
# Inline scans open at most this many clamd connections at once; an upload
# that finds them all taken is stored and scanned by a job instead. An inline
# session lasts as long as the upload, at the uploader's pace, so keep this
# plus jobs.concurrency.scan below clamd's MaxThreads.
max_inline_scans = 4

[media]
# Bump to regenerate every derived representation on next request. At
# least 1: zero means "none" inside sealed URLs.
variant_version = 1
# The libvips command line tool, run as a sandboxed subprocess for every
# render. Debian: libvips-tools; macOS: brew install vips. A build with
# pdfium renders PDFs more safely than one with poppler.
vips_command = "vips"
# The helper binaries run, sandboxed, to pull embedded images out of PDF and
# office files, to rasterise text samples, to compile typst documents and to
# draw GeoJSON files. Built by this workspace and found on the PATH by
# default.
# extract_command = "/usr/local/bin/agrafe-extract"
# render_text_command = "/usr/local/bin/agrafe-render-text"
# render_document_command = "/usr/local/bin/agrafe-render-document"
# render_geo_command = "/usr/local/bin/agrafe-render-geo"
# Originals above this size get an icon and no preview; text files still get
# their thumbnail, which reads only the first few KiB. Pictures and scans
# people want to see are a few MiB; above this a file is one where the icon
# will do, and every sandbox timeout it would burn is spared.
max_source_size = "64 MiB"
# Where originals are unpacked while rendering, and where vips spills its
# intermediates; the system temporary directory by default.
# tmp_dir = "/var/tmp/agrafe"

[media.sandbox]
# Limits on each rendering, extraction or compiling subprocess. The memory
# limit is an address space limit, enforced on Linux only.
timeout = "60s"
memory = "1 GiB"
max_output_size = "256 MiB"
# Whether the kernel confines each subprocess beyond its limits, with
# Landlock (the filesystem it sees is the system libraries and fonts, the
# file it reads and the directory it writes; no TCP) and seccomp (no
# sockets, namespaces, ptrace or mounts). Linux only; a default Docker
# container has both.
#   "auto": confine where the kernel can, and log what the worker got.
#   "required": refuse to start unless Landlock and seccomp both install.
#     Set it in production, so a kernel downgrade or a seccomp profile that
#     blocks the landlock_* syscalls cannot quietly turn confinement off.
#     What Landlock enforces still follows the kernel's ABI, which the
#     worker's "sandbox:" boot line names.
#   "off": limits and timeout only.
isolation = "auto"
# Extra read-only paths for the subprocesses, for a host that keeps its fonts
# or poppler's data outside /usr, /etc/fonts and /var/cache/fontconfig.
readable = []

[media.thumbnail]
width = 256
height = 256
quality = 80

[media.preview]
max_dimension = 2048
quality = 85

[media.embedded_image]
# A one-page document whose single image covers at least this fraction of the
# page, with at most `max_text_chars` of text, is treated as a wrapped image.
min_coverage = 0.7
max_text_chars = 50

[media.office]
# A first-page thumbnail for DOCX, ODT, XLSX and ODS files through
# LibreOffice, which converts the file to a PDF in the job's work directory,
# one short-lived sandboxed process per document. Off by default: unset,
# office files get the category icon, as they do when LibreOffice is not
# installed. Turning it on later regenerates existing blobs through a
# `variant_version` bump. Debian: libreoffice-writer-nogui,
# libreoffice-calc-nogui, fonts-dejavu-core and fonts-liberation; LibreOffice
# follows links in documents, which the sandbox refuses it the sockets for,
# so run it on a render-only worker with no outbound network as defence in
# depth. It needs Landlock: with `command` set, the worker
# refuses to start when the sandbox has none (unless `isolation = "off"`),
# and when `media.tmp_dir` is under /tmp, where LibreOffice may remove
# files for its pipe. See README.md, "Thumbnails for office files".
# command = "soffice"
# A user profile warmed at image build time, copied into the work directory
# for every run instead of being created there: a copy is milliseconds, a
# fresh profile longer, and every run still gets a private one.
# profile_template = "/var/lib/agrafe/soffice-profile"
# LibreOffice needs more address space and more time than vips; its output
# size, isolation and extra readable paths are those of [media.sandbox].
# [media.office.sandbox]
# timeout = "120s"
# memory = "2 GiB"

[media.geojson]
# A GeoJSON file gets a map as its preview: its geometry, drawn by the
# agrafe-render-geo helper, over a background fetched from the layers below.
# Added around the geometry, as a fraction of its larger side.
padding = 0.1
# The smallest extent drawn, so a single point or a tiny parcel still gets a
# readable map. Metres, or a string with a unit: "200 m", "3 km".
min_span = "200 m"
# The largest side of a background request, in pixels: the map is rendered
# at the preview box or this, whichever is smaller. The Géoplateforme caps
# GetMap at 2048.
max_size = 2048
# Vertices drawn at most over the whole file, after simplification to the
# pixel, so a huge file cannot produce a huge drawing.
max_vertices = 200000
# Shapes drawn at most over the whole file. A point is one vertex but one
# element, and the rasteriser pays per element: at this many points a map
# still takes well under a second to draw.
max_shapes = 20000
# The whole of one layer request, connect to last byte. A provider that
# fails or stalls fails the render attempt, which is retried; the file is
# never blamed for it.
fetch_timeout = "10s"
# A layer response larger than this is a failure, not a bomb to decode.
max_layer_size = "8 MiB"

# The default style, in the simplestyle-spec vocabulary. A feature's own
# simplestyle properties (stroke, stroke-width, stroke-opacity, fill,
# fill-opacity, marker-color, marker-size) override it key by key; a value
# that is not a hex colour, a number or a known size is ignored, and
# marker-symbol, title and description are not drawn. The casing under a
# stroke is the stroke darkened.
[media.geojson.style]
stroke = "#FFD400"
stroke-width = 4
stroke-opacity = 1
fill = "#FFD400"
fill-opacity = 0.35
marker-color = "#FFD400"
marker-size = "medium"

# Background layers, composited bottom to top; none by default, and the
# geometry is drawn on a flat neutral background. Every render sends the
# extent of a user's geometry to the provider, so the render workers' egress
# must allow these hosts, and nothing else needs it. {bbox} is
# minx,miny,maxx,maxy in EPSG:3857, {width} and {height} are pixels. The
# attribution burned into a corner of the map is the first drawn layer's
# that has one. The example is the IGN Géoplateforme: the orthophoto, and
# the administrative boundaries and names above parcel scale.
# [[media.geojson.layers]]
# url = "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=ORTHOIMAGERY.ORTHOPHOTOS&STYLES=&FORMAT=image/png&CRS=EPSG:3857&BBOX={bbox}&WIDTH={width}&HEIGHT={height}"
# attribution = "© IGN — Géoplateforme"
#
# [[media.geojson.layers]]
# url = "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=ADMINEXPRESS-COG-CARTO.LATEST&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE&CRS=EPSG:3857&BBOX={bbox}&WIDTH={width}&HEIGHT={height}"
# # Drawn only on an extent at least this wide: below it the layer carries
# # no name, only a boundary across the photo, and most maps are parcel-sized
# # and cost one request. max_span bounds the other end.
# min_span = "3 km"

[jobs]
# Workers are woken by NOTIFY on every enqueue; this is the fallback.
poll_interval = "2s"
# A job locked for longer than this is assumed orphaned and claimed again.
# Running workers renew their lease, so only a dead one lets it lapse.
lease_timeout = "10m"
# How often the reaper runs: it records expiries, schedules the purge of
# expired and deleted blobs, resets uploads stale for upload.stale_after
# and prunes dead jobs. Expiry itself does not wait for it.
reap_interval = "1m"
# A job that used up its attempts stays in the table, with its last error,
# for this long before the reaper removes it.
keep_failed = "7d"
# How often the audit sweeps the bucket against the blobs table: one
# listing request per thousand objects, and one query per thousand blobs.
# It reports what disagrees, re-renders a representation whose object is
# gone, and deletes nothing; `agrafe audit --fix` is the one that deletes.
# The first run is one interval after the process starts.
audit_interval = "7d"

# The job kinds this process runs workers for; every kind when omitted.
# A worker process dedicated to archive builds would say ["archive"]. Every
# kind must be handled by some process of the deployment. The --kinds flag
# takes precedence.
# kinds = ["fetch", "scan", "render", "rows", "archive", "document", "purge", "reap", "notify", "audit"]

# Workers per job kind; these are the defaults. Each kind has its own pool,
# which is what keeps slow archive builds from holding up scans and renders.
[jobs.concurrency]
fetch = 2
scan = 4
render = 4
rows = 2
archive = 1
document = 2
purge = 4
reap = 1
notify = 4
audit = 1

[webhook]
# Where state changes are POSTed, as one JSON body per event with the
# blob's full metadata, signed the Standard Webhooks way. See README.md,
# "Get told when a blob is ready". No webhook when unset: nothing is
# enqueued. One URL per deployment.
# url = "https://backend.example/agrafe/events"
# The signing secret: whsec_ followed by base64. Prefer AGRAFE_WEBHOOK__SECRET.
# Generate with: echo "whsec_$(openssl rand -base64 24)"
secret = ""
# The whole request, connect to the last byte of the response. Anything but
# a 2xx within it fails the attempt, retried with the jobs' backoff.
timeout = "10s"
# Which events to send; every event when omitted.
# events = ["ready", "infected", "failed", "expired"]
# The URL must be https: the body carries a url blob's presigned source and
# the blob's envelope. Set to true to post over plain http, on a trusted
# network or in development.
allow_insecure = false

[dashboard]
# Serve the HTML dashboard under /dashboard on the private interface: the
# queue, the blobs and the attachments, read-only, for an operator with a
# browser on the trusted network. Off by default.
enabled = false
# Show the retry and discard buttons. Off: the dashboard is read-only and
# the action routes answer 404.
actions = false
