# promtool test rules config/alerts.test.yml
#
# The rules over minutes, whose `for:` needs a minute's evaluation. The
# staleness alert, over weeks, is tested hourly in alerts.days.test.yml.
rule_files: [alerts.yml]
evaluation_interval: 1m

tests:
  # A kind that falls behind, against the thresholds of its group: an export
  # may wait an hour, anything else five minutes. Both hold for a while first.
  - interval: 1m
    input_series:
      - series: agrafe_jobs_oldest_due_seconds{instance="a",kind="scan",priority="normal"}
        values: "400x30"
      - series: agrafe_jobs_oldest_due_seconds{instance="b",kind="scan",priority="normal"}
        values: "0x30"
      - series: agrafe_jobs_oldest_due_seconds{instance="a",kind="render",priority="low"}
        values: "200x30"
      - series: agrafe_jobs_oldest_due_seconds{instance="a",kind="archive",priority="normal"}
        values: "3000x30"
      - series: agrafe_jobs_oldest_due_seconds{instance="a",kind="rows",priority="normal"}
        values: "4000x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: AgrafeQueueBehind
        exp_alerts: []
      - eval_time: 15m
        alertname: AgrafeQueueBehind
        exp_alerts:
          - exp_labels: {kind: scan, priority: normal}
            exp_annotations:
              summary: "agrafe scan jobs (normal) waiting for over 5 minutes"
      - eval_time: 10m
        alertname: AgrafeExportsBehind
        exp_alerts: []
      - eval_time: 20m
        alertname: AgrafeExportsBehind
        exp_alerts:
          - exp_labels: {kind: rows, priority: normal}

  # A kind with dead jobs alerts once, though every process reports the same
  # census, and a kind at zero does not. A dead delivery is both a dead job and
  # an undelivered webhook.
  - interval: 1m
    input_series:
      - series: agrafe_jobs{instance="a",kind="notify",priority="normal",state="dead"}
        values: "2x30"
      - series: agrafe_jobs{instance="b",kind="notify",priority="normal",state="dead"}
        values: "2x30"
      - series: agrafe_jobs{instance="a",kind="audit",priority="normal",state="dead"}
        values: "1x30"
      - series: agrafe_jobs{instance="a",kind="scan",priority="normal",state="dead"}
        values: "0x30"
      - series: agrafe_jobs{instance="a",kind="scan",priority="normal",state="due"}
        values: "9x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: AgrafeDeadJobs
        exp_alerts: []
      - eval_time: 10m
        alertname: AgrafeDeadJobs
        exp_alerts:
          - exp_labels: {kind: audit}
            exp_annotations:
              summary: "agrafe has dead audit jobs: GET /jobs?state=dead"
          - exp_labels: {kind: notify}
            exp_annotations:
              summary: "agrafe has dead notify jobs: GET /jobs?state=dead"
      - eval_time: 1m
        alertname: AgrafeWebhookUndelivered
        exp_alerts:
          - exp_labels: {kind: notify, priority: normal, state: dead}
            exp_annotations:
              summary: "agrafe gave up delivering webhooks: GET /jobs?kind=notify&state=dead"

  # A kind no process handles, though another process reports it at zero.
  - interval: 1m
    input_series:
      - series: agrafe_workers{instance="a",kind="scan"}
        values: "0x30"
      - series: agrafe_workers{instance="b",kind="scan"}
        values: "0x30"
      - series: agrafe_workers{instance="a",kind="render"}
        values: "0x30"
      - series: agrafe_workers{instance="b",kind="render"}
        values: "4x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: AgrafeNoWorkers
        exp_alerts: []
      - eval_time: 10m
        alertname: AgrafeNoWorkers
        exp_alerts:
          - exp_labels: {kind: scan}

  # Orphans and foreign objects cost storage and do not alert.
  - interval: 1m
    input_series:
      - series: agrafe_audit_findings{instance="a",kind="missing_original"}
        values: "3x5"
      - series: agrafe_audit_findings{instance="b",kind="missing_original"}
        values: "0x5"
      - series: agrafe_audit_findings{instance="a",kind="orphan"}
        values: "7x5"
      - series: agrafe_audit_findings{instance="a",kind="foreign"}
        values: "1x5"
      - series: agrafe_audit_findings{instance="a",kind="unknown"}
        values: "0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: AgrafeAuditFindings
        exp_alerts:
          - exp_labels: {kind: missing_original}
            exp_annotations:
              summary: "the last agrafe audit found missing_original mismatches: GET /blobs?failed=true, or the audit log lines"
